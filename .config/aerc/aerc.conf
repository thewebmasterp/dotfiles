[general]
default-save-path=~/Downloads
log-file=~/.aerc.log

[ui]
# Folder sidebar: the system folders are bold (via the "system" user style in
# stylesets/base); service folders are plain. Colour stays for unread.
dirlist-left = {{.StyleSwitch .Folder (case `^(INBOX|Urgent|Tlh|Techpods|Drafts|Sent|Archive|Junk|Trash)$` "system")}}
border-char-vertical="│"
border-char-horizontal="─"
# Static Catppuccin Mocha theme (no darkman switching - aerc doesn't
# reliably hot-reload an already-running session; confirmed crashes on
# real long-running sessions). "base" (structural: bold/reverse/default,
# no colors) is layered under the actual color values.
styleset-name=base,catppuccin-mocha-colors
fuzzy-complete=true
icon-new=✨
icon-attachment=📎
icon-old=🕰️
icon-replied=📝
icon-flagged=🚩
icon-deleted=🗑️

[statusline]

[viewer]
alternatives=text/plain,text/html
header-layout=From,To,Cc,Bcc,Date,Subject

[compose]
edit-headers=true
header-layout=From,To,Cc,Subject
reply-to-self=false
empty-subject-warning=true
no-attachment-warning=^[^>]*attach(ed|ment)

[multipart-converters]
text/html=pandoc -f markdown -t html --standalone

[filters]
text/html=pandoc -f html -t plain
text/plain=colorize
text/calendar=calendar
message/delivery-status=colorize
message/rfc822=colorize
.headers=colorize

[openers]

[hooks]

[templates]
