# -*- conf -*-

shell=/usr/bin/zsh

font=MonaspiceAr Nerd Font:fontfeatures=calt:size=13.5, JetBrainsMono Nerd Font:size=13.5, FontAwesome

# Managed by darkman (dark-mode.d/light-mode.d/foot.sh) - never edit this
# file directly for theme switching; it only points at an untracked state
# file that darkman rewrites.
include=~/.local/state/theme/foot.ini

[scrollback]
lines=100000

[key-bindings]
clipboard-copy=Control+c XF86Copy
clipboard-paste=Control+v XF86Paste

[search-bindings]
cancel=Control+g Control+Shift+c Escape

[url-bindings]
cancel=Control+g Control+Shift+c Control+d Escape

[colors-dark]
alpha=0.75

# Catppuccin Mocha
background=1e1e2e
foreground=cdd6f4
selection-foreground=1e1e2e
selection-background=f5e0dc
urls=89b4fa

## Normal/regular colors (color palette 0-7)
regular0=45475a  # black (surface1)
regular1=f38ba8  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=89b4fa  # blue
regular5=f5c2e7  # pink
regular6=94e2d5  # teal
regular7=bac2de  # white (subtext1)

## Bright colors (color palette 8-15)
bright0=585b70   # bright black (surface2)
bright1=f38ba8   # bright red
bright2=a6e3a1   # bright green
bright3=f9e2af   # bright yellow
bright4=89b4fa   # bright blue
bright5=f5c2e7   # bright pink
bright6=94e2d5   # bright teal
bright7=a6adc8   # bright white (subtext0)

[colors-light]
alpha=0.75

# Catppuccin Frappe
background=303446
foreground=c6d0f5
selection-foreground=303446
selection-background=f2d5cf
urls=8caaee

## Normal/regular colors (color palette 0-7)
regular0=51576d  # black (surface1)
regular1=e78284  # red
regular2=a6d189  # green
regular3=e5c890  # yellow
regular4=8caaee  # blue
regular5=f4b8e4  # pink
regular6=81c8be  # teal
regular7=b5bfe2  # white (subtext1)

## Bright colors (color palette 8-15)
bright0=626880   # bright black (surface2)
bright1=e78284   # bright red
bright2=a6d189   # bright green
bright3=e5c890   # bright yellow
bright4=8caaee   # bright blue
bright5=f4b8e4   # bright pink
bright6=81c8be   # bright teal
bright7=a5adce   # bright white (subtext0)
