# Fixes a 1-column redraw corruption in TUIs (aerc) that happens ONLY under
# tmux: after aerc draws a line filling the last column (e.g. a long
# non-ASCII subject), tmux mis-tracks the auto-margin wrap and eats the
# first column of every following line until a full repaint. The culprit is
# the aggressive redraw optimizations in the tmux-256color terminfo; the
# more conservative screen-256color avoids them. Truecolor is preserved via
# COLORTERM=truecolor (aerc/tcell honour it regardless of terminfo), so the
# only thing lost is italics, which the aerc styleset doesn't use.
# (`sync` = foot synchronized output, keeps repaints atomic; RGB advertises
# truecolor to foot.)
set -g default-terminal "screen-256color"
set -as terminal-features ",foot*:RGB:sync"
