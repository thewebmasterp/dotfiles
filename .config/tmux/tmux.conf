# Declare foot's terminal capabilities to tmux so it paints correctly.
# Fixes transient 1-column shift/clip artifacts in TUIs (e.g. aerc) that
# occur only under tmux: tmux's own grid is correct, but partial repaints
# to foot smear until a full redraw. `sync` (synchronized output) makes
# foot apply each frame atomically, eliminating the smearing.
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:sync"
