# Catppuccin Frappe theme for tmux
# Included via ~/.local/state/theme/tmux (managed by darkman)

set -g status-style "bg=#303446,fg=#c6d0f5"
set -g status-left "#[bg=#8caaee,fg=#303446,bold] #S #[bg=#303446,fg=#8caaee]"
set -g status-right "#[fg=#626880]#[bg=#626880,fg=#c6d0f5] %H:%M #[fg=#ca9ee6]#[bg=#ca9ee6,fg=#303446,bold] %d-%b-%y "

set -g window-status-format "#[fg=#a5adce] #I:#W "
set -g window-status-current-format "#[bg=#51576d,fg=#f4b8e4,bold] #I:#W "

set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#8caaee"

set -g message-style "bg=#e5c890,fg=#303446"
set -g mode-style "bg=#626880,fg=#f4b8e4"
