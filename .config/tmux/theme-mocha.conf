# Catppuccin Mocha theme for tmux
# Included via ~/.local/state/theme/tmux (managed by darkman)

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"
set -g status-right "#[fg=#585b70]#[bg=#585b70,fg=#cdd6f4] %H:%M #[fg=#cba6f7]#[bg=#cba6f7,fg=#1e1e2e,bold] %d-%b-%y "

set -g window-status-format "#[fg=#a6adc8] #I:#W "
set -g window-status-current-format "#[bg=#45475a,fg=#f5c2e7,bold] #I:#W "

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

set -g message-style "bg=#f9e2af,fg=#1e1e2e"
set -g mode-style "bg=#585b70,fg=#f5c2e7"
